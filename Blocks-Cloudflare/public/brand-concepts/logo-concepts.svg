    <text x="36" y="240" fill="#101828" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">04 · Calendar Window</text>
    <text x="36" y="266" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="14">Clear scheduling cue with a polished product feel.</text>
  </g>

  <text x="72" y="846" fill="#98A2B3" font-family="Inter, Arial, sans-serif" font-size="13">Core palette · Ink #101828 · Blue #4F8EF7 · Soft blue #82AEFA</text>
</svg>
